schema: spec-driven

context: |
  canvas_metatag is a Drupal contrib module (package "Canvas") that adds an SEO
  dialog to the Drupal Canvas editor and owns the head output of Canvas pages
  and of nodes rendered through content templates, for coupled and headless
  (canvas_headless) delivery. canvas_metatag_ai is its optional AI submodule,
  built on the Drupal AI module.
  Constraints an agent cannot infer from the code:
  - Nothing committed may name or compare against a commercial vendor or
    product. Neutral wording only ("search result preview").
  - Supported Canvas is the 1.x development branch; Canvas internals used are
    listed in ARCHITECTURE.md and every new one needs a row there and a test
    that fails if Canvas changes it.
  - The dialog never saves an entity directly while the editor is open: page
    and template values travel in Canvas's own drafts.
  - Engineering ethos: least code that works, no speculative abstractions, but
    never trim validation at trust boundaries, escaping, access checks,
    cacheability or accessibility.
  - v1 non-goals (README): XML sitemaps, redirects, robots.txt/llms.txt
    management, keyword scoring, bulk editing, per-node overrides, metatag data
    import, search-console integrations. Reopening one needs an explicit
    product-owner decision recorded in the change's proposal.

rules:
  specs:
    - Capability names are kebab-case nouns.
    - Requirements use MUST, SHOULD and MAY; every requirement has at least one WHEN/THEN scenario.
    - Specs describe behaviour a site builder or developer can observe, not implementation.
  proposal:
    - State what is out of scope and any non-goal being reopened.
  tasks:
    - Every task that changes behaviour names the test that proves it (PHPUnit kernel/unit, vitest, or Playwright).
    - Visible changes end with a browser check on the farm site and screenshots.
