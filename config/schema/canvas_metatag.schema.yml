canvas_metatag.value:
  type: mapping
  label: 'Value: typed text, a fact, a media item or a field source'
  mapping:
    text:
      type: string
      label: 'Typed text'
      requiredKey: false
    fact:
      type: string
      label: 'Fact'
      requiredKey: false
      constraints:
        Choice: [title, description, site, url, author, published, modified, image, identity]
    media:
      type: string
      label: 'Media UUID'
      requiredKey: false
    unit:
      type: string
      label: 'The unit a linked duration field counts in'
      requiredKey: false
      constraints:
        Choice: [minute, hour]
    source:
      type: mapping
      label: 'Canvas entity-field source'
      requiredKey: false
      mapping:
        expression:
          type: string
          label: 'Expression'
        sourceType:
          type: string
          label: 'Source type'
          constraints:
            Choice: [entity-field]

canvas_metatag.values:
  type: mapping
  label: 'SEO values'
  mapping:
    title:
      type: canvas_metatag.value
      label: 'Title main part'
      requiredKey: false
    title_end:
      type: canvas_metatag.value
      label: 'Title ending (empty typed text: no ending)'
      requiredKey: false
    description:
      type: canvas_metatag.value
      label: 'Description'
      requiredKey: false
    social:
      type: mapping
      label: 'Social'
      requiredKey: false
      mapping:
        title:
          type: canvas_metatag.value
          label: 'Social title'
          requiredKey: false
        description:
          type: canvas_metatag.value
          label: 'Social description'
          requiredKey: false
        image:
          type: canvas_metatag.value
          label: 'Social image'
          requiredKey: false
    robots:
      type: mapping
      label: 'Robots'
      requiredKey: false
      mapping:
        noindex:
          type: boolean
          label: 'Hide from search engines'
          requiredKey: false
        nofollow:
          type: boolean
          label: 'Do not follow links'
          requiredKey: false
        nosnippet:
          type: boolean
          label: 'No text preview'
          requiredKey: false
        max_snippet:
          type: integer
          label: 'Text preview length (-1: no limit)'
          requiredKey: false
          constraints:
            Range:
              min: -1
              max: 1000
        max_image_preview:
          type: string
          label: 'Image preview size'
          requiredKey: false
          constraints:
            Choice: [none, standard, large]
    schema:
      type: mapping
      label: 'Structured data'
      requiredKey: false
      mapping:
        type:
          type: string
          label: 'Type'
          requiredKey: false
        props:
          type: sequence
          label: 'Property values'
          requiredKey: false
          sequence:
            type: canvas_metatag.value
            label: 'Value'
        custom:
          type: string
          label: 'Custom JSON-LD'
          requiredKey: false
        skip:
          type: sequence
          label: 'Hand-added items left out, by @id'
          requiredKey: false
          sequence:
            type: string
            label: '@id as written'

canvas_metatag.site:
  type: config_object
  label: 'SEO site settings'
  mapping:
    identity:
      type: mapping
      label: 'Site identity'
      mapping:
        kind:
          type: string
          label: 'Kind'
          constraints:
            Choice: [organization, person]
        name:
          type: string
          label: 'Name (empty: the site name)'
        separator:
          type: string
          label: 'Title separator'
        logo:
          type: string
          label: 'Logo media UUID'
        default_image:
          type: string
          label: 'Default social image media UUID'
        same_as:
          type: sequence
          label: 'Profiles'
          sequence:
            type: uri
            label: 'Profile URL'
    values:
      type: canvas_metatag.values
      label: 'Site defaults'
    currency:
      type: string
      label: 'Currency of prices (an ISO 4217 code; empty: none)'
      requiredKey: false

canvas.content_template.*.*.*.third_party.canvas_metatag:
  type: mapping
  label: 'SEO defaults for this content type'
  mapping:
    values:
      type: canvas_metatag.values
      label: 'Values'
