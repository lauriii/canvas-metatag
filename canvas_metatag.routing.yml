  options:
    no_cache: 'TRUE'
    # The dialog runs in a signed-in browser. A bearer token would skip the
    # CSRF check, which core applies to cookie sessions only.
    _auth: ['cookie']

canvas_metatag.api.share_sample:
  path: '/canvas-metatag/api/share-sample'
  defaults:
    _controller: 'Drupal\canvas_metatag\Controller\ApiController::shareSample'
  methods: [GET]
  requirements:
    _permission: 'edit canvas metatag+administer canvas metatag'
  options:
    no_cache: 'TRUE'
    _auth: ['cookie']
