################
# GitLabCI template for Drupal projects.
#
# This template is designed to give any Contrib maintainer everything they need to test, without requiring modification.
# It is also designed to keep up to date with Core Development automatically through the use of include files that can be centrally maintained.
# As long as you include the project, ref and three files below, any future updates added by the Drupal Association will be used in your
# pipelines automatically. However, you can modify this template if you have additional needs for your project.
# The full documentation is on https://project.pages.drupalcode.org/gitlab_templates/
################

# For information on alternative values for 'ref' see https://project.pages.drupalcode.org/gitlab_templates/info/templates-version/
# To test a Drupal 7 project, change the first include filename from .main.yml to .main-d7.yml
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'
#
################
# Pipeline configuration variables are defined with default values and descriptions in the file
# https://git.drupalcode.org/project/gitlab_templates/-/blob/main/includes/include.drupalci.variables.yml
# Uncomment the lines below if you want to override any of the variables. The following is just an example.
################
variables:
  # The module's own CSS and TypeScript live in the extension, which has its
  # own type check and tests (see the frontend job).
  SKIP_STYLELINT: '1'
  SKIP_ESLINT: '1'
  # The built extension bundle is generated, so it is not spell checked.
  _CSPELL_IGNORE_PATHS: 'extension/dist/*'
  # Lint jobs pass, keep them that way.
  _CSPELL_ALLOW_FAILURE: '0'
  _PHPCS_ALLOW_FAILURE: '0'
  _PHPSTAN_ALLOW_FAILURE: '0'
  # Core's node_modules push the composer artifact over the upload limit (413),
  # and nothing here uses them: ESLint/Stylelint are skipped, and the custom
  # jobs below run their own npm ci.
  _COMPOSER_YARN_INSTALL: '0'

# The custom jobs run for merge requests and on the default branch, on
# the template's PHP image, which also has Node.
.custom-job:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  image:
    name: $_CONFIG_DOCKERHUB_ROOT/php-$PHP_VERSION-$PHP_IMAGE_VARIANT:$PHP_IMAGE_TAG

################
# Frontend (custom job): the extension's own checks.
#
# Type check, unit tests, the forbidden-pattern check and a build of the React
# app in extension/.
################
frontend:
  extends: .custom-job
  stage: validate
  needs: []
  script:
    - cd $CI_PROJECT_DIR/extension && npm ci && npm run verify

################
# Build assets check (custom job): fails if the committed build is stale.
#
# extension/dist and the asset hashes in extension/index.html are committed.
# Rebuild them and fail if the result differs from what is checked in, so a
# fresh `npm run build` + commit is never forgotten.
################
build-assets:
  extends: .custom-job
  stage: validate
  needs: []
  script:
    - cd $CI_PROJECT_DIR/extension && npm ci && npm run build
    - cd $CI_PROJECT_DIR
    - git config --global --add safe.directory $CI_PROJECT_DIR
    # --intent-to-add so newly generated (untracked) files also show in the diff.
    - git add --intent-to-add extension/dist
    - |
      git diff --exit-code -- extension/dist extension/index.html || {
        echo "The committed extension build is out of date. Run 'npm run build' in extension/ and commit the result.";
        exit 1;
      }

################
# Registry strings (custom job): fails if src/RegistryStrings.php is stale.
#
# Every string the dialog shows from data/schema-types.json and
# data/search-features.json is a literal in src/RegistryStrings.php, so that
# it is extracted for translation. Regenerate it and fail on a difference.
################
registry-strings:
  extends: .custom-job
  stage: validate
  needs: []
  script:
    - cd $CI_PROJECT_DIR && php scripts/registry-strings.php
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - |
      git diff --exit-code -- src/RegistryStrings.php || {
        echo "src/RegistryStrings.php is out of date. Run 'php scripts/registry-strings.php' and commit the result.";
        exit 1;
      }

################
# Vocabulary lint (custom job): the module's data against schema.org.
#
# Downloads the schema.org release the module pins (Vocabulary::RELEASE),
# trims it as the site's download is (Vocabulary::build) and fails on a type
# or name that isn't schema.org's: in the registry, the rules file (its
# `expects` types too) and the shared graph fixtures.
################
vocabulary-lint:
  extends: .custom-job
  stage: validate
  needs: []
  script:
    - cd $CI_PROJECT_DIR
    - RELEASE=$(php -r 'require "src/Vocabulary.php"; echo Drupal\canvas_metatag\Vocabulary::RELEASE;')
    - curl -fsSL --max-time 60 -o /tmp/release.jsonld "https://schema.org/version/$RELEASE/schemaorg-current-https.jsonld"
    - php scripts/vocabulary-lint.php /tmp/release.jsonld

################
# Search features review (custom job): a warning, never a failure.
#
# The verdicts follow the search features' documentation, which changes.
# After 120 days without a review of data/search-features.json this job
# fails as allowed to, which shows as a warning: re-read each feature's
# documentation, update the file and its `reviewed` date.
################
search-features-review:
  extends: .custom-job
  stage: validate
  needs: []
  allow_failure: true
  script:
    - cd $CI_PROJECT_DIR
    - php -r '$reviewed = json_decode(file_get_contents("data/search-features.json"), TRUE)["reviewed"]; $days = intdiv(time() - strtotime($reviewed), 86400); echo "Rules reviewed on $reviewed, $days days ago.\n"; exit($days > 120 ? 1 : 0);'

################
# The Canvas contract against Canvas's development branch (custom job).
#
# src/Sources.php is the only caller of Canvas internals (its prop source
# suggester, labeler and expressions). Their pinning tests, the group
# canvas_metatag_canvas_contract, also run against drupal/canvas:1.x-dev, so a
# change there fails here before a release. composer.json keeps the released
# constraint. Not allowed to fail.
################
'phpunit (canvas dev)':
  extends: phpunit
  allow_failure: false
  variables:
    # Plain PHPUnit, so that --group applies.
    _PHPUNIT_CONCURRENT: '0'
    _PHPUNIT_EXTRA: --group canvas_metatag_canvas_contract
  script:
    - composer require --no-interaction --with-all-dependencies 'drupal/canvas:1.x-dev'
    - !reference [.phpunit-base, script]

################
# Playwright end-to-end tests (custom job; not part of the template above).
#
# The template runs PHPUnit/PHPCS/PHPStan/cspell. Playwright additionally needs
# a running Drupal site and a browser, so this job serves the codebase the
# template's `composer` job produced and installs a browser. The suite uses
# Drupal core's @drupal/playwright (like Canvas); see tests/e2e/fixture.ts.
# (A composer-required Canvas release already ships its built UI, so no build.)
#
# All projects run, one worker: host-contract first, then coupled, headless
# and ai, each spec file on a seeded site of its own. The headless and ai
# projects need the modules named in composer.json's require-dev.
#
# This job is required to pass. If a pipeline trips an environment assumption
# (marked CEILING below), fix the environment rather than adding allow_failure.
################
playwright:
  extends: .custom-job
  stage: test
  # Reuse the built project (Drupal + Canvas + this module) from the template.
  needs:
    - composer
  # CEILING: default DA PHP image. Assumes (a) Node is present (DA php images
  # bundle it for eslint/nightwatch) and (b) `sudo -u www-data php` resolves php
  # on the sudo PATH. If either fails, use Canvas's image
  # (ghcr.io/drupal-canvas/drupal-testing) instead.
  variables:
    DRUPAL_TEST_BASE_URL: http://localhost
    DRUPAL_TEST_DB_URL: sqlite://localhost/sites/default/files/.ht.sqlite
    # The Drupal CLI runs from the docroot...
    DRUPAL_TEST_DRUPAL_ROOT: $CI_PROJECT_DIR/$_WEB_ROOT
    # ...as the user Apache serves as, so the sandbox files (notably the SQLite
    # DB and the token signing keys) are owned by www-data and readable by the
    # served site.
    DRUPAL_TEST_WEBSERVER_USER: www-data
    # The template symlinks the module under modules/custom (not contrib); the
    # setup-file path is resolved relative to the docroot above.
    CANVAS_METATAG_SETUP_FILE: modules/custom/canvas_metatag/tests/src/TestSite/CanvasMetatagTestSetup.php
  before_script:
    # Serve the docroot with Apache at http://localhost (as the template test jobs do).
    - rm -rf /var/www/html && ln -s $CI_PROJECT_DIR/$_WEB_ROOT /var/www/html
    - mkdir -p $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites
    - chown -R www-data:www-data $CI_PROJECT_DIR
    - service apache2 start
  script:
    # The checkout at $CI_PROJECT_DIR is the module root, so tests/e2e lives here.
    - cd $CI_PROJECT_DIR/tests/e2e
    - npm ci
    # CEILING: apt-installs browser deps into the image; needs root plus network.
    - npx playwright install --with-deps chromium
    - npx playwright test
  artifacts:
    when: on_failure
    expire_in: 1 day
    paths:
      - tests/e2e/test-results/
